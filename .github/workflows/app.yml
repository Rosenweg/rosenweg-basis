# Wiederverwendbar: Bau und Release einer Rosenweg-Flutter-App auf allen fuenf
# Plattformen. Gerufen von .github/workflows/app.yml jeder App (aus vorlage/,
# werkzeug/neue-app.sh), damit nicht jede App 4-5 Workflow-Dateien kopiert.
#
# Ablauf:
#   version   Version aus pubspec.yaml (x.y.z+n). Mit veroeffentlichen: true
#             (Push auf main) wird nur veroeffentlicht, wenn es den Tag vx.y.z
#             noch nicht gibt (Version unveraendert = nur CI, kein Release)
#             und der Rosenweg-Signierschluessel da ist.
#   linux     flutter analyze + test + build linux, Debian-Paket
#             (linux/paket/bauen.sh) - ubuntu-latest im Container debian:13
#   android   APK, signiert mit dem Rosenweg-Schluessel (Org-Secrets
#             ANDROID_KEYSTORE_BASE64/-PASSWORD, ANDROID_KEY_ALIAS/-PASSWORD;
#             nur bei Push auf main oder Tag v*, sonst Debug-Signatur und kein
#             Release)
#   windows   Inno-Setup-Installer (windows/installer/<app>.iss) mit Rauchtest
#   macos     App + DMG (macos/installer/bauen.sh), ad hoc oder Developer ID
#   ios       Bau ohne Signatur (unsigniertes .ipa, nur als Nachweis)
#   release   GitHub-Release v<version> am gebauten Commit, sobald Linux und
#             Android durch sind - wartet NICHT auf Windows, macOS, iOS; der
#             Text nennt sie "wird nachgereicht".
#   nachtrag  wenn Windows/macOS/iOS fertig sind (auch fehlgeschlagen): deren
#             Dateien ins bestehende Release, SHA256SUMS neu, im Text steht,
#             welche Plattformen fehlen und warum; danach startet es apps.yml
#             der App fuer den Tag (-> /apps mit allem, was im Release liegt;
#             ein von GITHUB_TOKEN angelegtes Release loest "release
#             published" nicht aus).
#             Ein Fehlschlag bei Windows/macOS/iOS verhindert das Release nie.
#   stationen nur mit stationen_seite: nach dem Release ein Pull Request in
#             Rosenweg/os-stationen mit pakete/<app>/paket.conf (VERSION,
#             SHA256_amd64 aus SHA256SUMS, SEITE, STARTER aus dem .deb), ueber
#             die GitHub App "Rosenweg Pakete" (PAKETE_APP_ID/PAKETE_APP_KEY).
#             os-stationen laedt das .deb dann auf den PXE-Server (Label
#             paket-update). Gemergt wird von Hand.
#
# Runner: Job wahl (runner-wahl.yml) entscheidet fuer Linux, Android und
# Windows zwischen eigenen Runnern und GitHub-gehosteten: privates Repo immer
# eigene, oeffentliches eigene nur wenn einer frei oder zuschaltbar ist, Forks
# nie. macOS und iOS laufen immer bei GitHub (macos-latest). Caches ueber actions/cache
# (Schluessel = Version + Pruefsumme; ein PR kann den Cache von main nicht
# ueberschreiben). Windows laeuft in oeffentlichen Repos immer (Minuten
# gratis), in einem privaten App-Repo nur fuer ein Release, von Hand
# (workflow_dispatch) oder mit alle_plattformen: true. macOS und iOS laufen
# NUR bei einem Release (neue Version), mit alle_plattformen: true oder mit
# mac: true (workflow_dispatch, Eingabe "mac") - GitHub Free erlaubt nur 5
# gleichzeitige macOS-Jobs je Organisation, PR-Laeufe stauten sich stundenlang.
# Uebersprungene Jobs zaehlen als "skipped"; die Rulesets verlangen keine
# Status-Checks, nichts blockiert.
#
# Secrets: der Aufrufer reicht sie NUR bei Push auf main bzw. Tag v* weiter
# (bei pull_request leer, siehe vorlage/.github/workflows/app.yml); hier
# zusaetzlich SIGNIEREN (unten). Fork-PRs bekommen ohnehin keine.
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS,
#   ANDROID_KEY_PASSWORD                  Org-Secrets, fuer das App-Repo freigeben
#   MACOS_ZERTIFIKAT_P12, MACOS_ZERTIFIKAT_PASSWORT, NOTAR_KEY_P8, NOTAR_KEY_ID,
#   NOTAR_ISSUER                          optional: Developer ID + Notarisierung
#   WINDOWS_ZERTIFIKAT_PFX, WINDOWS_ZERTIFIKAT_PASSWORT
#                                         optional: Code-Signing (sonst SmartScreen)
#   PAKETE_APP_ID, PAKETE_APP_KEY         optional: GitHub App "Rosenweg Pakete"
#                                         (nur os-stationen) fuer den Job stationen
# rosenweg-basis ist oeffentlich: pub holt sie ohne Token.
#
# Aufrufer (vorlage/.github/workflows/app.yml):
#   permissions: { contents: read }
#   jobs:
#     app:
#       permissions: { contents: write, actions: write, packages: read }
#       uses: Rosenweg/rosenweg-basis/.github/workflows/app.yml@main
#       with: { app: rosenweg-x, paket: ch.rosenweg4303.x, veroeffentlichen: ${{ github.event_name == 'push' }} }
#       secrets:
#         ANDROID_KEYSTORE_BASE64: ${{ github.event_name == 'push' && secrets.ANDROID_KEYSTORE_BASE64 || '' }}
#         ...
name: Rosenweg-App

on:
  workflow_call:
    inputs:
      app:
        description: Name wie Repo und Paket, z. B. rosenweg-telefonbuch
        type: string
        required: true
      paket:
        description: Kennung (applicationId, Bundle-ID), z. B. ch.rosenweg4303.telefonbuch
        type: string
        required: true
      titel:
        description: Anzeigename fuer das Release, z. B. Rosenweg Telefonbuch
        type: string
        default: ""
      ordner:
        description: Ordner der App im Repo (nur rosenweg-basis selbst braucht vorlage)
        type: string
        default: "."
      plattformen:
        description: Welche Plattformen (Leerzeichen-getrennt)
        type: string
        default: "linux android windows macos ios"
      alle_plattformen:
        description: Windows, macOS und iOS auch ohne Release bauen
        type: boolean
        default: false
      mac:
        description: macOS und iOS auch ohne Release bauen (von Hand, workflow_dispatch mit mac true)
        type: boolean
        default: false
      veroeffentlichen:
        description: Bei neuer Version Release anlegen und an /apps schicken (Push auf main)
        type: boolean
        default: false
      basis_lokal:
        description: rosenweg_basis aus dem ausgecheckten Repo (nur in rosenweg-basis selbst)
        type: boolean
        default: false
      flutter_version:
        type: string
        default: "3.47.5"
      flutter_sha256:
        description: Pruefsumme des Linux-Archivs dieser Flutter-Version
        type: string
        default: 2132e990f236f8d22e7c6314b29a191a95b10d7cbcfec9b4e2e303d996652cbb
      signatur_sha256:
        description: Erwarteter SHA-256 des Signaturzertifikats (Rosenweg-Schluessel)
        type: string
        default: 7b3bac26e82b6103546b96861dcf1bb89b3239424ff11fdf684975cf78c5a5ae
      systempakete:
        description: Zusaetzliche Debian-Pakete fuer den Linux-Bau (Leerzeichen-getrennt), z. B. libmpv-dev fuer Apps mit media_kit
        type: string
        default: ""
      apps_workflow:
        description: Workflow der App, der ein Release an /apps schickt (leer = keiner)
        type: string
        default: apps.yml
      stationen_seite:
        description: Web-Seite (Kennung aus /api/stations/<id>/apps), die die App auf den Stationen ersetzt; gesetzt = nach dem Release PR in os-stationen (leer = keiner)
        type: string
        default: ""
    secrets:
      ANDROID_KEYSTORE_BASE64: { required: false }
      ANDROID_KEYSTORE_PASSWORD: { required: false }
      ANDROID_KEY_ALIAS: { required: false }
      ANDROID_KEY_PASSWORD: { required: false }
      MACOS_ZERTIFIKAT_P12: { required: false }
      MACOS_ZERTIFIKAT_PASSWORT: { required: false }
      NOTAR_KEY_P8: { required: false }
      NOTAR_KEY_ID: { required: false }
      NOTAR_ISSUER: { required: false }
      WINDOWS_ZERTIFIKAT_PFX: { required: false }
      WINDOWS_ZERTIFIKAT_PASSWORT: { required: false }
      PAKETE_APP_ID: { required: false }
      PAKETE_APP_KEY: { required: false }

# Nur zum Lesen; Jobs, die mehr brauchen (release, nachtrag), sagen es selbst.
permissions:
  contents: read

env:
  ORDNER: ${{ inputs.ordner }}
  APP: ${{ inputs.app }}
  FLUTTER_VERSION: ${{ inputs.flutter_version }}
  FLUTTER_SHA256: ${{ inputs.flutter_sha256 }}
  # Signieren nur bei Push auf main oder Tag v* (github = Ereignis des
  # Aufrufers), nie bei pull_request: dann Debug-Signatur bzw. unsigniert.
  SIGNIEREN: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
  # Oeffentliches Repo: Windows, macOS und iOS immer bauen (Minuten gratis).
  OEFFENTLICH: ${{ github.event.repository.private == false }}

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      los: ${{ steps.v.outputs.los }}
      linux: ${{ steps.v.outputs.linux }}
      android: ${{ steps.v.outputs.android }}
      windows: ${{ steps.v.outputs.windows }}
      macos: ${{ steps.v.outputs.macos }}
      ios: ${{ steps.v.outputs.ios }}
    steps:
      - uses: actions/checkout@v4

      - name: Version und Plattformen
        id: v
        env:
          VEROEFFENTLICHEN: ${{ inputs.veroeffentlichen }}
          ALLE: ${{ inputs.alle_plattformen }}
          MAC: ${{ inputs.mac }}
          PLATTFORMEN: ${{ inputs.plattformen }}
          # nur ob sie da sind; die Werte selbst braucht erst der Android-Job
          KS_B64: ${{ env.SIGNIEREN == 'true' && secrets.ANDROID_KEYSTORE_BASE64 || '' }}
          KS_PASS: ${{ env.SIGNIEREN == 'true' && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          KEY_ALIAS: ${{ env.SIGNIEREN == 'true' && secrets.ANDROID_KEY_ALIAS || '' }}
          KEY_PASS: ${{ env.SIGNIEREN == 'true' && secrets.ANDROID_KEY_PASSWORD || '' }}
        run: |
          set -euo pipefail
          cd "$ORDNER"
          zeile=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | tr -d '[:space:]')
          version=${zeile%%+*}
          [[ "$zeile" =~ ^[0-9]+\.[0-9]+\.[0-9]+\+[0-9]+$ ]] \
            || { echo "::error file=$ORDNER/pubspec.yaml::version muss x.y.z+n sein (ist: $zeile)"; exit 1; }
          tag="v$version"
          echo "Version $zeile, Tag $tag"
          los=false
          if [ "$VEROEFFENTLICHEN" = true ] && [ "$SIGNIEREN" != true ]; then
            echo "::warning::veroeffentlichen nur bei Push auf main oder Tag v* (dieser Lauf: $GITHUB_EVENT_NAME $GITHUB_REF) - kein Release."
          elif [ "$VEROEFFENTLICHEN" = true ]; then
            # Tag ueber git, checkout hat den Zugang hinterlegt; scheitert
            # git, bricht set -e hier ab (kein Release)
            vorhanden=$(git ls-remote --tags origin "refs/tags/$tag")
            if [ -n "$vorhanden" ]; then
              echo "::notice::Tag $tag gibt es schon: Version unveraendert, kein Release."
            elif [[ " $PLATTFORMEN " == *" android "* ]] && { [ -z "$KS_B64" ] || [ -z "$KS_PASS" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASS" ]; }; then
              echo "::warning::Kein Release fuer $tag: Signier-Secrets (ANDROID_*) fehlen oder sind fuer dieses Repo nicht freigegeben."
            else
              los=true
              echo "::notice::Neue Version $version: alle Plattformen bauen, dann Release $tag."
            fi
          fi
          # Windows: Release, alle_plattformen, oeffentliches Repo oder von Hand.
          # macOS/iOS: nur Release, alle_plattformen oder mac: true (GitHub
          # Free erlaubt nur 5 gleichzeitige macOS-Jobs je Organisation).
          win=false; mac=false
          if [ "$los" = true ] || [ "$ALLE" = true ] || [ "$OEFFENTLICH" = true ] || [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then win=true; fi
          if [ "$los" = true ] || [ "$ALLE" = true ] || [ "$MAC" = true ]; then mac=true; fi
          {
            echo "version=$version"; echo "tag=$tag"; echo "los=$los"
            for p in linux android; do
              [[ " $PLATTFORMEN " == *" $p "* ]] && echo "$p=true" || echo "$p=false"
            done
            [[ " $PLATTFORMEN " == *" windows "* ]] && [ "$win" = true ] && echo "windows=true" || echo "windows=false"
            for p in macos ios; do
              [[ " $PLATTFORMEN " == *" $p "* ]] && [ "$mac" = true ] && echo "$p=true" || echo "$p=false"
            done
          } >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

  # Runner-Wahl: eigene oder GitHub-gehostete (Regeln im Kopf von
  # runner-wahl.yml). Privat: immer eigene; oeffentlich: eigene, wenn einer frei
  # ist oder zuschaltbar; Forks nie. macOS/iOS bleiben bei GitHub.
  wahl:
    uses: Rosenweg/rosenweg-basis/.github/workflows/runner-wahl.yml@main
    secrets:
      PAKETE_APP_ID: ${{ secrets.PAKETE_APP_ID }}
      PAKETE_APP_KEY: ${{ secrets.PAKETE_APP_KEY }}

  linux:
    needs: [version, wahl]
    if: needs.version.outputs.linux == 'true'
    # Eigene Runner wie bei Android (ausser Forks); der Bau laeuft im Container
    # debian:13, apt dort als root – auf den Runnern braucht es nur Docker.
    runs-on: ${{ fromJSON(needs.wahl.outputs.linux) }}
    # Debian 13 wie die Stationen: bauen.sh rechnet die Abhaengigkeiten des
    # .deb mit dpkg-shlibdeps gegen dieses System.
    container: debian:13
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      # vor checkout: mit git holt checkout das Repo samt .git (Stand im Paket)
      - name: Systempakete
        env:
          # Eingang als Umgebungsvariable (nie ${{ }} in die Shell), nur Paketnamen
          ZUSATZ: ${{ inputs.systempakete }}
        run: |
          # leer ist erlaubt (grep findet in leerer Eingabe keine Zeile)
          case "$ZUSATZ" in *[!a-z0-9+.:\ -]*) echo "::error::systempakete: nur Paketnamen"; exit 1 ;; esac
          apt-get update -qq
          # shellcheck disable=SC2086
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            ca-certificates clang cmake ninja-build pkg-config xz-utils curl unzip git zstd \
            libgtk-3-dev liblzma-dev libstdc++-14-dev libsecret-1-dev libjsoncpp-dev \
            dpkg-dev binutils patchelf librsvg2-bin file lintian $ZUSATZ >/dev/null

      - uses: actions/checkout@v4

      - name: Flutter-Cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/rosenweg-flutter-ci
          key: flutter-${{ github.job }}-${{ inputs.flutter_version }}-${{ inputs.flutter_sha256 }}-${{ hashFiles(format('{0}/pubspec.lock', inputs.ordner), format('{0}/pubspec.yaml', inputs.ordner)) }}
          restore-keys: flutter-${{ github.job }}-${{ inputs.flutter_version }}-${{ inputs.flutter_sha256 }}-

      - name: Flutter (feste Version mit Pruefsumme)
        run: |
          set -euo pipefail
          C="$HOME/.cache/rosenweg-flutter-ci"; mkdir -p "$C"
          if [ ! -x "$C/flutter-$FLUTTER_VERSION/bin/flutter" ]; then
            curl -fsSL -o "$C/flutter.txz" "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_$FLUTTER_VERSION-stable.tar.xz"
            echo "$FLUTTER_SHA256  $C/flutter.txz" | sha256sum -c -
            mkdir -p "$C/flutter-$FLUTTER_VERSION" && tar -xJf "$C/flutter.txz" -C "$C/flutter-$FLUTTER_VERSION" --strip-components=1 && rm "$C/flutter.txz"
          fi
          # Flutter-SDK als git-Arbeitsstand gehoert im Container nicht root
          git config --global --add safe.directory "$C/flutter-$FLUTTER_VERSION"
          echo "$C/flutter-$FLUTTER_VERSION/bin" >> "$GITHUB_PATH"
          echo "PUB_CACHE=$C/pub-cache" >> "$GITHUB_ENV"
          # Git-Abhaengigkeiten (rosenweg_basis) nie aus dem Cache: ein alter pub-cache/git loeste sie ohne Abhaengigkeiten auf ("Unable to satisfy pubspec.yaml using pubspec.lock", 27.11.2026)
          rm -rf "$C/pub-cache/git"

      # rosenweg-basis ist oeffentlich: pub holt sie ohne Token. Hier nur die
      # lokale Basis (vorlage/ in rosenweg-basis selbst) und die Lockdatei.
      - &basis
        name: Basis und pubspec.lock
        shell: bash
        env:
          BASIS_LOKAL: ${{ inputs.basis_lokal }}
        run: |
          set -euo pipefail
          if [ "$BASIS_LOKAL" = true ]; then
            # rosenweg-basis prueft die eigene Vorlage gegen den eigenen Stand
            rel=$(printf '%s' "$ORDNER" | sed 's#[^/][^/]*#..#g')
            printf 'dependency_overrides:\n  rosenweg_basis:\n    path: %s\n' "$rel" > "$ORDNER/pubspec_overrides.yaml"
            echo "rosenweg_basis aus dem Arbeitsstand ($rel)"
          fi
          # pubspec.lock darf nicht auf eine lokale Basis zeigen (pubspec_overrides.yaml war aktiv)
          if [ "$BASIS_LOKAL" != true ] && [ -f "$ORDNER/pubspec.lock" ] && grep -q 'source: path' "$ORDNER/pubspec.lock"; then
            echo "::error file=$ORDNER/pubspec.lock::pubspec.lock enthaelt einen path-Eintrag. Ohne pubspec_overrides.yaml 'flutter pub get' und committen."
            exit 1
          fi
          if [ "$BASIS_LOKAL" != true ] && [ -f "$ORDNER/pubspec.lock" ]; then
            echo "PUB_GET=flutter pub get --enforce-lockfile" >> "$GITHUB_ENV"
          else
            echo "PUB_GET=flutter pub get" >> "$GITHUB_ENV"
          fi

      - name: Pruefen und bauen
        run: |
          set -euo pipefail
          cd "$ORDNER"
          flutter config --no-analytics --enable-linux-desktop >/dev/null
          $PUB_GET
          flutter analyze
          flutter test
          flutter build linux --release

      # Dasselbe .deb wie im Bau-Container (linux/paket/im-container.sh). Die
      # Stationen holen es mit Pruefsumme vom PXE-Server (os-stationen,
      # pakete/<app>/paket.conf), eigene Debian-Rechner ueber /apps.
      - name: Debian-Paket
        run: |
          set -euo pipefail
          cd "$ORDNER"
          rm -rf ausgabe && mkdir ausgabe
          linux/paket/bauen.sh --nur-paket
          cp linux/paket/out/*.deb ausgabe/
          (cd ausgabe && sha256sum ./*.deb)

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.app }}-linux
          path: ${{ inputs.ordner }}/ausgabe/*.deb
          if-no-files-found: error
          retention-days: 14

  android:
    needs: [version, wahl]
    if: needs.version.outputs.android == 'true'
    # Eigene Runner (CT 140/145, [self-hosted, Linux, rosenweg]) und GitHub-
    # Runner teilen sich die Arbeit: Android auf den eigenen, Linux auf
    # ubuntu-latest. Ereignisse aus Forks nie auf eigene Runner (Entscheid
    # Stefan 28.11.2026; Fork-PRs brauchen ausserdem eine Genehmigung).
    runs-on: ${{ fromJSON(needs.wahl.outputs.linux) }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read   # commons-rosenweg (ch.rosenweg4303:cloud, :updater) aus GitHub Packages
    env:
      JDK_VERSION: "21.0.13.1+2"
      JDK_SHA256: bb8a93f9ae6e7a693b2b721e85dbeff26ae1a77447985a8d7afcdd9c7cf6222e
      # cmdline-tools 19.0: ab 23.0 ist sdkmanager nur noch ein Verweis auf die neue "android"-CLI
      ANDROID_CMDLINE_TOOLS: "13114758"
      ANDROID_CMDLINE_TOOLS_SHA256: 7ec965280a073311c339e571cd5de778b9975026cfcbe79f2b1cdcb1e15317ee
    steps:
      - uses: actions/checkout@v4

      # Muster rosenweg-salz android.yml: alles als feste Versionen mit
      # Pruefsumme (nicht das vorinstallierte SDK des Runners), im actions/cache;
      # Plattform, Build-Tools und NDK laedt das Android-Gradle-Plugin beim
      # ersten Bau selbst. Gradle-Cache dazu (Schluessel: Gradle-Dateien).
      - name: Werkzeug-Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/rosenweg-flutter-ci
          key: android-${{ inputs.flutter_version }}-${{ inputs.flutter_sha256 }}-${{ env.JDK_SHA256 }}-${{ env.ANDROID_CMDLINE_TOOLS_SHA256 }}-${{ hashFiles(format('{0}/pubspec.lock', inputs.ordner), format('{0}/android/**/*.kts', inputs.ordner), format('{0}/android/gradle/wrapper/gradle-wrapper.properties', inputs.ordner)) }}
          restore-keys: android-${{ inputs.flutter_version }}-${{ inputs.flutter_sha256 }}-${{ env.JDK_SHA256 }}-${{ env.ANDROID_CMDLINE_TOOLS_SHA256 }}-

      - name: Flutter, JDK, Android-SDK (feste Versionen mit Pruefsumme)
        run: |
          set -euo pipefail
          C="$HOME/.cache/rosenweg-flutter-ci"; mkdir -p "$C"
          if [ ! -x "$C/flutter-$FLUTTER_VERSION/bin/flutter" ]; then
            curl -fsSL -o "$C/flutter.txz" "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_$FLUTTER_VERSION-stable.tar.xz"
            echo "$FLUTTER_SHA256  $C/flutter.txz" | sha256sum -c -
            mkdir -p "$C/flutter-$FLUTTER_VERSION" && tar -xJf "$C/flutter.txz" -C "$C/flutter-$FLUTTER_VERSION" --strip-components=1 && rm "$C/flutter.txz"
          fi
          J="$C/jdk-${JDK_VERSION//+/_}"
          if [ ! -x "$J/bin/java" ]; then
            curl -fsSL -o "$C/jdk.tgz" "https://github.com/adoptium/temurin21-binaries/releases/download/jdk-${JDK_VERSION//+/%2B}/OpenJDK21U-jdk_x64_linux_hotspot_${JDK_VERSION//+/_}.tar.gz"
            echo "$JDK_SHA256  $C/jdk.tgz" | sha256sum -c -
            mkdir -p "$J" && tar -xzf "$C/jdk.tgz" -C "$J" --strip-components=1 && rm "$C/jdk.tgz"
          fi
          A="$C/android-sdk"
          if [ ! -x "$A/cmdline-tools/$ANDROID_CMDLINE_TOOLS/bin/sdkmanager" ]; then
            curl -fsSL -o "$C/ct.zip" "https://dl.google.com/android/repository/commandlinetools-linux-${ANDROID_CMDLINE_TOOLS}_latest.zip"
            echo "$ANDROID_CMDLINE_TOOLS_SHA256  $C/ct.zip" | sha256sum -c -
            rm -rf "$C/ct" && unzip -q "$C/ct.zip" -d "$C/ct" && rm "$C/ct.zip"
            mkdir -p "$A/cmdline-tools"
            rm -rf "$A/cmdline-tools/$ANDROID_CMDLINE_TOOLS" && mv "$C/ct/cmdline-tools" "$A/cmdline-tools/$ANDROID_CMDLINE_TOOLS" && rm -rf "$C/ct"
          fi
          ln -sfn "$ANDROID_CMDLINE_TOOLS" "$A/cmdline-tools/latest"
          (yes || true) | JAVA_HOME="$J" "$A/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$A" --licenses >/dev/null
          if [ ! -d "$A/platform-tools" ]; then
            JAVA_HOME="$J" "$A/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$A" "platform-tools" >/dev/null
          fi
          echo "$C/flutter-$FLUTTER_VERSION/bin" >> "$GITHUB_PATH"
          echo "$J/bin" >> "$GITHUB_PATH"
          {
            echo "JAVA_HOME=$J"
            echo "ANDROID_HOME=$A"
            echo "ANDROID_SDK_ROOT=$A"
            echo "GRADLE_USER_HOME=$C/gradle"
            echo "GRADLE_OPTS=-Dorg.gradle.daemon=false"
            echo "PUB_CACHE=$C/pub-cache"
          } >> "$GITHUB_ENV"
          # Git-Abhaengigkeiten (rosenweg_basis) nie aus dem Cache: ein alter pub-cache/git loeste sie ohne Abhaengigkeiten auf ("Unable to satisfy pubspec.yaml using pubspec.lock", 27.11.2026)
          rm -rf "$C/pub-cache/git"

      - *basis

      # Nur bei Push auf main oder Tag v* (SIGNIEREN); bei pull_request immer
      # Debug-Signatur, die Secrets kommen dann gar nicht in den Job.
      - name: Signierschluessel (nur Push auf main / Tag v*)
        if: env.SIGNIEREN == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            (umask 077; printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/rosenweg.jks")
            echo "SIGNING_STORE_FILE=$RUNNER_TEMP/rosenweg.jks" >> "$GITHUB_ENV"
            echo "Signatur: Rosenweg-Schluessel"
          else
            echo "::warning::Kein Rosenweg-Signierschluessel (Org-Secret ANDROID_KEYSTORE_BASE64 fuer dieses Repo freigeben) - APK mit Debug-Schluessel signiert, kein Release."
          fi

      - name: APK bauen und pruefen
        env:
          SIGNING_STORE_PASSWORD: ${{ env.SIGNIEREN == 'true' && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          SIGNING_KEY_ALIAS: ${{ env.SIGNIEREN == 'true' && secrets.ANDROID_KEY_ALIAS || '' }}
          SIGNING_KEY_PASSWORD: ${{ env.SIGNIEREN == 'true' && secrets.ANDROID_KEY_PASSWORD || '' }}
          # rosenweg_basis android/build.gradle.kts holt commons-rosenweg aus GitHub
          # Packages; Maven dort verlangt auch fuer oeffentliche Pakete eine Anmeldung.
          GITHUB_TOKEN: ${{ github.token }}
          PAKET: ${{ inputs.paket }}
          SOLL: ${{ inputs.signatur_sha256 }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          cd "$ORDNER"
          flutter config --no-analytics >/dev/null
          $PUB_GET
          flutter build apk --release
          rm -rf ausgabe && mkdir ausgabe
          apk=build/app/outputs/flutter-apk/app-release.apk
          bt=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          badging=$("$bt/aapt2" dump badging "$apk" | head -n 1)
          echo "$badging"
          echo "$badging" | grep -q "name='$PAKET'" || { echo "::error::Paketname ist nicht $PAKET"; exit 1; }
          echo "$badging" | grep -q "versionName='$VERSION'" || { echo "::error::versionName passt nicht zu $VERSION"; exit 1; }
          if [ -n "${SIGNING_STORE_FILE:-}" ]; then
            ist=$("$bt/apksigner" verify --print-certs "$apk" | sed -n 's/.*certificate SHA-256 digest: //p' | head -n 1 | tr -d ':' | tr 'A-F' 'a-f')
            soll=$(printf '%s' "$SOLL" | tr -d ': ' | tr 'A-F' 'a-f')
            [ "$ist" = "$soll" ] || { echo "::error::Signatur passt nicht zum Rosenweg-Schluessel (SHA-256 $ist)"; exit 1; }
            name="$APP-$VERSION.apk"
          else
            name="$APP-$VERSION-debug-signiert.apk"
          fi
          cp "$apk" "ausgabe/$name"
          (cd ausgabe && sha256sum ./*.apk)

      - name: Schluessel entfernen
        if: always()
        run: rm -f "$RUNNER_TEMP/rosenweg.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.app }}-android
          path: ${{ inputs.ordner }}/ausgabe/*.apk
          if-no-files-found: error
          retention-days: 14

  windows:
    needs: [version, wahl]
    if: needs.version.outputs.windows == 'true'
    # Windows auf dem eigenen Runner win-runner (VM 142, [self-hosted, Windows,
    # rosenweg-windows]), ausser bei Ereignissen aus Forks: die laufen weiter
    # auf windows-latest (Entscheid Stefan 28.11.2026).
    runs-on: ${{ fromJSON(needs.wahl.outputs.windows) }}
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ inputs.flutter_version }}
          channel: stable

      - *basis

      - name: Bauen
        run: |
          set -euo pipefail
          cd "$ORDNER"
          flutter config --no-analytics --enable-windows-desktop >/dev/null
          $PUB_GET
          flutter build windows --release

      - name: Signierzertifikat (nur Push auf main / Tag v*, falls Secret gesetzt)
        if: env.SIGNIEREN == 'true'
        shell: pwsh
        env:
          PFX: ${{ secrets.WINDOWS_ZERTIFIKAT_PFX }}
        run: |
          if ($env:PFX) {
            $p = Join-Path $env:RUNNER_TEMP 'signieren.pfx'
            [IO.File]::WriteAllBytes($p, [Convert]::FromBase64String($env:PFX))
            "RW_SIGNTOOL_ZERT=$p" | Out-File -Append $env:GITHUB_ENV
            $st = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1
            "RW_SIGNTOOL=$($st.FullName)" | Out-File -Append $env:GITHUB_ENV
          } else {
            Write-Output "::warning::Kein Code-Signing-Zertifikat - Installer unsigniert (SmartScreen fragt beim ersten Start)."
          }

      # Inno Setup: laeuft auch unsigniert, installiert ohne Adminrechte fuer die
      # Person, saubere Deinstallation (Begruendung: windows/installer/<app>.iss).
      - name: Installer (Inno Setup)
        env:
          RW_SIGNTOOL_PASSWORT: ${{ env.SIGNIEREN == 'true' && secrets.WINDOWS_ZERTIFIKAT_PASSWORT || '' }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          cd "$ORDNER"
          quelle="build/windows/x64/runner/Release"
          signieren() {
            [ -n "${RW_SIGNTOOL_ZERT:-}" ] || return 0
            MSYS_NO_PATHCONV=1 "$(cygpath -u "$RW_SIGNTOOL")" sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 \
              /f "$RW_SIGNTOOL_ZERT" /p "$RW_SIGNTOOL_PASSWORT" "$@"
          }
          signieren "$quelle"/*.exe
          iscc="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          [ -x "$iscc" ] || choco install innosetup -y --no-progress >/dev/null
          # Git-Bash wandelt Argumente wie /DVersion=... sonst in Pfade um
          MSYS_NO_PATHCONV=1 MSYS2_ARG_CONV_EXCL='*' \
            "$iscc" "/DVersion=$VERSION" "/DQuelle=$(cygpath -w "$PWD/$quelle")" "windows\\installer\\$APP.iss"
          signieren build/windows-installer/*.exe
          ls -la build/windows-installer

      # Installer still (pro Person) ausfuehren und die App 15 s laufen lassen:
      # sie muss starten und am Leben bleiben (Muster rosenweg-vm).
      - name: Rauchtest (installieren, starten)
        shell: pwsh
        run: |
          Set-Location $env:ORDNER
          $setup = Get-ChildItem build/windows-installer/*.exe | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList '/VERYSILENT','/CURRENTUSER','/SUPPRESSMSGBOXES','/NORESTART' -Wait
          $bin = ($env:APP -replace '-', '_') + '.exe'
          $exe = Get-ChildItem (Join-Path $env:LOCALAPPDATA 'Programs') -Recurse -Filter $bin | Select-Object -First 1
          if (-not $exe) { throw "nicht installiert: $bin" }
          $p = Start-Process $exe.FullName -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) { throw "App nach dem Start beendet (Code $($p.ExitCode))" }
          Stop-Process -Id $p.Id -Force

      - name: Aufraeumen
        if: always()
        run: rm -f "$RUNNER_TEMP/signieren.pfx"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.app }}-windows
          path: ${{ inputs.ordner }}/build/windows-installer/*.exe
          if-no-files-found: error
          retention-days: 14

  macos:
    needs: version
    if: needs.version.outputs.macos == 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ inputs.flutter_version }}
          channel: stable

      - *basis

      - name: Signierzertifikat (nur Push auf main / Tag v*, falls Secret gesetzt)
        if: env.SIGNIEREN == 'true'
        env:
          P12: ${{ secrets.MACOS_ZERTIFIKAT_P12 }}
          P12_PW: ${{ secrets.MACOS_ZERTIFIKAT_PASSWORT }}
          NOTAR_KEY_P8: ${{ secrets.NOTAR_KEY_P8 }}
        run: |
          set -euo pipefail
          if [ -n "$P12" ]; then
            KC="$RUNNER_TEMP/signieren.keychain-db"; KC_PW="$(uuidgen)"
            security create-keychain -p "$KC_PW" "$KC"
            security set-keychain-settings -lut 3600 "$KC"
            security unlock-keychain -p "$KC_PW" "$KC"
            echo "$P12" | base64 --decode > "$RUNNER_TEMP/z.p12"
            security import "$RUNNER_TEMP/z.p12" -k "$KC" -P "$P12_PW" -T /usr/bin/codesign
            rm "$RUNNER_TEMP/z.p12"
            security set-key-partition-list -S apple-tool:,apple: -k "$KC_PW" "$KC" >/dev/null
            security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          else
            echo "::warning::Kein Developer-ID-Zertifikat - App ad hoc signiert (Gatekeeper fragt beim ersten Start)."
          fi
          if [ -n "$NOTAR_KEY_P8" ]; then
            echo "$NOTAR_KEY_P8" | base64 --decode > "$RUNNER_TEMP/notar.p8"
            echo "RW_NOTAR_KEY=$RUNNER_TEMP/notar.p8" >> "$GITHUB_ENV"
          fi

      - name: Bauen (App + DMG)
        env:
          RW_NOTAR_KEY_ID: ${{ env.SIGNIEREN == 'true' && secrets.NOTAR_KEY_ID || '' }}
          RW_NOTAR_ISSUER: ${{ env.SIGNIEREN == 'true' && secrets.NOTAR_ISSUER || '' }}
        run: |
          set -euo pipefail
          cd "$ORDNER"
          flutter config --no-analytics >/dev/null
          $PUB_GET
          macos/installer/bauen.sh
          ls -la build/macos-installer

      - name: Aufraeumen
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/notar.p8"
          security delete-keychain "$RUNNER_TEMP/signieren.keychain-db" 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.app }}-macos
          path: ${{ inputs.ordner }}/build/macos-installer/*.dmg
          if-no-files-found: error
          retention-days: 14

  ios:
    needs: version
    if: needs.version.outputs.ios == 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ inputs.flutter_version }}
          channel: stable

      - *basis

      # Nur ein Bau ohne Signatur: Verteilen (TestFlight/App Store, Ad-hoc) braucht
      # das Apple Developer Program; /apps nimmt keine iOS-Dateien an.
      - name: Bauen (ohne Signatur)
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          cd "$ORDNER"
          flutter config --no-analytics >/dev/null
          $PUB_GET
          flutter build ios --release --no-codesign
          rm -rf ausgabe && mkdir -p ausgabe/Payload
          cp -R build/ios/iphoneos/Runner.app ausgabe/Payload/
          (cd ausgabe && zip -qry "$APP-$VERSION-ios-unsigniert.ipa" Payload && rm -rf Payload)
          ls -la ausgabe

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.app }}-ios-unsigniert
          path: ${{ inputs.ordner }}/ausgabe/*.ipa
          if-no-files-found: error
          retention-days: 14

  # Release, sobald Linux und Android durch sind. Windows/macOS/iOS kommen im
  # Job nachtrag dazu.
  release:
    needs: [version, linux, android]
    if: ${{ !cancelled() && !failure() && needs.version.outputs.los == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write   # Tag und Release
    env:
      PHASE: release
      TAG: ${{ needs.version.outputs.tag }}
      VERSION: ${{ needs.version.outputs.version }}
      TITEL: ${{ inputs.titel }}
      PLATTFORMEN: ${{ inputs.plattformen }}
      ST_LINUX: ${{ needs.linux.result }}
      ST_ANDROID: ${{ needs.android.result }}
    steps:
      - uses: actions/download-artifact@v4
        if: needs.linux.result == 'success'
        with:
          name: ${{ inputs.app }}-linux
          path: ausgabe

      - uses: actions/download-artifact@v4
        if: needs.android.result == 'success'
        with:
          name: ${{ inputs.app }}-android
          path: ausgabe

      - &summen
        name: Pruefsummen
        run: |
          set -euo pipefail
          mkdir -p ausgabe && rm -f ausgabe/SHA256SUMS
          ls -la ausgabe
          (cd ausgabe && sha256sum ./* > "$RUNNER_TEMP/SHA256SUMS") && mv "$RUNNER_TEMP/SHA256SUMS" ausgabe/
          cat ausgabe/SHA256SUMS
          # Das .deb gehoert immer dazu: os-stationen (Job stationen, paket.conf)
          # vergleicht seine Pruefsumme mit dieser Datei.
          if [ "${ST_LINUX:-}" = success ] && ! grep -q '_amd64\.deb$' ausgabe/SHA256SUMS; then
            echo "::error::Linux ist gebaut, aber kein .deb in SHA256SUMS"; exit 1
          fi

      # Release, Dateien, Text und der Start von apps.yml ueber die REST-API
      # (github-script). Derselbe Schritt in release und nachtrag
      # (PHASE im Job-env).
      - &release_schritt
        name: Release (Dateien, Text, /apps)
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const e = process.env;
            const repo = { owner: context.repo.owner, repo: context.repo.repo };
            const tag = e.TAG;
            const nachtrag = e.PHASE === 'nachtrag';
            const PLATTFORM = {
              linux: { titel: 'Linux', passt: (n) => n.endsWith('.deb'), text: 'Linux, Debian 13 (Stationen über den PXE-Server, sonst /apps)' },
              android: { titel: 'Android', passt: (n) => n.endsWith('.apk'), text: 'Android (Rosenweg-Schlüssel)' },
              windows: { titel: 'Windows', passt: (n) => n.endsWith('-Setup.exe'), text: 'Windows' },
              macos: { titel: 'macOS', passt: (n) => n.endsWith('.dmg'), text: 'macOS' },
              ios: { titel: 'iOS', passt: (n) => n.endsWith('.ipa'), text: 'iOS, unsigniert (nur Nachweis, nicht installierbar)' },
            };
            const lauf = `${context.serverUrl}/${repo.owner}/${repo.repo}/actions/runs/${context.runId}`;
            const gewollt = e.PLATTFORMEN.split(/\s+/).filter((p) => PLATTFORM[p]);
            const lokal = fs.existsSync('ausgabe') ? fs.readdirSync('ausgabe').sort() : [];
            if (lokal.some((f) => f.endsWith('-debug-signiert.apk'))) {
              core.setFailed('Debug-signierte APK - kein Release.'); return;
            }

            // Release holen oder (Phase release) anlegen
            let rel;
            try {
              rel = (await github.rest.repos.getReleaseByTag({ ...repo, tag })).data;
            } catch (err) {
              if (nachtrag || err.status !== 404) throw err;
              rel = (await github.rest.repos.createRelease({
                ...repo, tag_name: tag, target_commitish: context.sha,
                name: `${e.TITEL || e.APP} ${tag}`, body: 'Wird gerade angelegt …',
              })).data;
              core.notice(`Release ${tag} angelegt: ${rel.html_url}`);
            }
            const hoch = async (name, data) => {
              const alt = rel.assets.find((a) => a.name === name);
              if (alt) await github.rest.repos.deleteReleaseAsset({ ...repo, asset_id: alt.id });
              await github.rest.repos.uploadReleaseAsset({ ...repo, release_id: rel.id, name, data });
              core.info(`Hochgeladen: ${name}`);
            };
            for (const f of lokal) {
              if (f === 'SHA256SUMS') continue;
              if (rel.assets.some((a) => a.name === f && a.size === fs.statSync(path.join('ausgabe', f)).size)) continue;
              await hoch(f, fs.readFileSync(path.join('ausgabe', f)));
            }
            // SHA256SUMS ueber alle Dateien (nachtrag hat alle Artefakte geladen)
            if (fs.existsSync('ausgabe/SHA256SUMS')) await hoch('SHA256SUMS', fs.readFileSync('ausgabe/SHA256SUMS'));
            rel = (await github.rest.repos.getRelease({ ...repo, release_id: rel.id })).data;

            // Text: vorhandene Dateien, fehlende Plattformen mit Grund
            const namen = rel.assets.map((a) => a.name).sort();
            const zeilen = [];
            const fehlt = [];
            for (const p of gewollt) {
              const da = namen.filter(PLATTFORM[p].passt);
              for (const n of da) zeilen.push(`| \`${n}\` | ${PLATTFORM[p].text} |`);
              if (da.length) continue;
              const st = e[`ST_${p.toUpperCase()}`] || '';
              const grund = st === '' ? 'wird nachgereicht, sobald der Bau durch ist'
                : st === 'failure' ? `Bau fehlgeschlagen (z. B. GitHub-Ausgabenlimit); nachholen: im [Lauf](${lauf}) „Re-run failed jobs“`
                : st === 'cancelled' ? 'Bau abgebrochen'
                : st === 'skipped' ? 'nicht gebaut'
                : `kein Ergebnis (${st})`;
              fehlt.push(`- **${PLATTFORM[p].titel}**: ${grund}`);
            }
            let body = `Version ${e.VERSION}, automatisch nach dem Merge auf main gebaut (${context.sha}).\n\n`;
            body += '| Datei | Plattform |\n|---|---|\n' + zeilen.join('\n') + '\n';
            if (fehlt.length) body += `\n**Fehlt:**\n${fehlt.join('\n')}\n`;
            try {
              const c = await github.rest.repos.getCommit({ ...repo, ref: context.sha });
              body += '\n---\n\n' + c.data.commit.message.slice(0, 3000) + '\n';
            } catch (err) {
              core.warning(`Commit-Nachricht nicht gelesen: ${err.message}`);
            }
            await github.rest.repos.updateRelease({ ...repo, release_id: rel.id, body });
            if (nachtrag && fehlt.length) core.warning(`Release ${tag} ohne: ${fehlt.join(' ').replace(/\*\*/g, '')}`);

            // Am Ende: /apps mit allem, was im Release liegt
            if (nachtrag && e.WF) {
              await github.rest.actions.createWorkflowDispatch({ ...repo, workflow_id: e.WF, ref: tag });
              core.info(`${e.WF} fuer ${tag} gestartet`);
            }

  # Neues Release -> Pull Request in Rosenweg/os-stationen mit der neuen
  # pakete/<app>/paket.conf (VERSION, SHA256_amd64, beim ersten Mal auch SEITE
  # und STARTER). Nur mit stationen_seite (die Web-Seite, die die App auf den
  # Stationen ersetzt) und nur, wenn der Aufrufer PAKETE_APP_ID/PAKETE_APP_KEY
  # weiterreicht (GitHub App "Rosenweg Pakete", schreibt nur in os-stationen).
  # Gemergt wird nie hier: os-stationen laedt das .deb auf den PXE-Server
  # (Label paket-update, Workflow paket-hochladen.yml) und meldet das im PR.
  stationen:
    needs: [version, linux, release]
    if: ${{ !cancelled() && needs.release.result == 'success' && needs.linux.result == 'success' && inputs.stationen_seite != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read   # Release-Dateien lesen; geschrieben wird mit dem App-Token
    env:
      TAG: ${{ needs.version.outputs.tag }}
      TITEL: ${{ inputs.titel }}
      SEITE: ${{ inputs.stationen_seite }}
      HAT_APP: ${{ secrets.PAKETE_APP_ID != '' && secrets.PAKETE_APP_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: app

      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.app }}-linux
          path: ausgabe

      # Was die Stationen pruefen, muss genau das sein, was im Release liegt:
      # Pruefsumme gegen SHA256SUMS des Release, Name gegen VERSION.
      - name: Paket lesen
        id: deb
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          debs=(ausgabe/*.deb)
          [ "${#debs[@]}" -eq 1 ] || { echo "::error::Genau ein .deb erwartet, gefunden: ${#debs[@]}"; exit 1; }
          deb="${debs[0]}"; datei="$(basename "$deb")"
          name="$(dpkg-deb -f "$deb" Package)"; ver="$(dpkg-deb -f "$deb" Version)"
          [ "$name" = "$APP" ] || { echo "::error::Paket heisst $name, erwartet $APP"; exit 1; }
          [ "$datei" = "${name}_${ver}_amd64.deb" ] || { echo "::error::Dateiname $datei passt nicht zu $name $ver"; exit 1; }
          [[ "$ver" =~ ^[0-9]+\.[0-9]+\.[0-9]+-[0-9]+$ ]] || { echo "::error::Version $ver nicht x.y.z-n"; exit 1; }
          [[ "$SEITE" =~ ^rosenweg-[a-z0-9-]+$ ]] || { echo "::error::stationen_seite '$SEITE' ist keine Kennung rosenweg-…"; exit 1; }
          summe="$(sha256sum "$deb" | cut -d' ' -f1)"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" -p SHA256SUMS -D release
          grep -Eq "^$summe  (\./)?$datei\$" release/SHA256SUMS \
            || { echo "::error::$datei ($summe) steht nicht so in SHA256SUMS von $TAG"; cat release/SHA256SUMS; exit 1; }
          starter=()
          while IFS= read -r p; do starter+=("$(basename "$p")"); done \
            < <(dpkg-deb -c "$deb" | awk '{print $NF}' | grep -E '^\./usr/share/applications/[^/]+\.desktop$')
          [ "${#starter[@]}" -eq 1 ] || { echo "::error::Genau ein Starter in /usr/share/applications erwartet: ${starter[*]:-keiner}"; exit 1; }
          {
            echo "version=$ver"; echo "summe=$summe"; echo "datei=$datei"; echo "starter=${starter[0]}"
          } >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"

      - name: Ohne GitHub App kein Pull Request
        if: env.HAT_APP != 'true'
        env:
          VER: ${{ steps.deb.outputs.version }}
          SUMME: ${{ steps.deb.outputs.summe }}
        run: |
          echo "::warning::PAKETE_APP_ID/PAKETE_APP_KEY nicht weitergereicht - kein PR in os-stationen. Von Hand: pakete/$APP/paket.conf auf $VER (SHA256 $SUMME)."

      - name: Zugang zu os-stationen
        id: zugang
        if: env.HAT_APP == 'true'
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.PAKETE_APP_ID }}
          private-key: ${{ secrets.PAKETE_APP_KEY }}
          owner: Rosenweg
          repositories: os-stationen

      - uses: actions/checkout@v4
        if: env.HAT_APP == 'true'
        with:
          repository: Rosenweg/os-stationen
          token: ${{ steps.zugang.outputs.token }}
          path: os-stationen

      # Bestehende paket.conf: nur VERSION, SHA256_amd64, STARTER und die
      # Release-Nummer in den Kommentaren; SEITE bleibt, wie os-stationen sie
      # hat (dort wird sie entschieden). Neue: aus linux/paket/paket.conf der
      # App (Vorlage aus rosenweg-basis), sonst aus der kurzen Vorlage hier.
      - name: Pull Request in os-stationen
        if: env.HAT_APP == 'true'
        env:
          GH_TOKEN: ${{ steps.zugang.outputs.token }}
          SLUG: ${{ steps.zugang.outputs.app-slug }}
          VER: ${{ steps.deb.outputs.version }}
          SUMME: ${{ steps.deb.outputs.summe }}
          DATEI: ${{ steps.deb.outputs.datei }}
          STARTER: ${{ steps.deb.outputs.starter }}
        run: |
          set -euo pipefail
          heute="$(TZ=Europe/Zurich date +%d.%m.%Y)"
          rel_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG"
          cd os-stationen
          ordner="pakete/$APP"; conf="$ordner/paket.conf"
          neu=false; hinweis=""
          if [ -f "$conf" ]; then
            alt_seite="$(sed -n 's/^SEITE=//p' "$conf" | head -1)"
            if [ -n "$alt_seite" ] && [ "$alt_seite" != "$SEITE" ]; then
              hinweis="SEITE bleibt \`$alt_seite\` (os-stationen); stationen_seite der App sagt \`$SEITE\` - bitte klaeren."
              echo "::warning::$hinweis"
            fi
            sed -i -E \
              -e "s/^VERSION=.*/VERSION=$VER/" \
              -e "s/^SHA256_amd64=.*/SHA256_amd64=$SUMME/" \
              -e "/^# .*Release/ s/v[0-9]+\.[0-9]+\.[0-9]+/$TAG/g" \
              -e "/^# .*(berechnet|Pruefsumme|Prüfsumme)/ s/[0-9]{1,2}\.[0-9]{1,2}\.20[0-9]{2}/$heute/g" \
              "$conf"
            if grep -q '^STARTER=' "$conf"; then sed -i "s/^STARTER=.*/STARTER=$STARTER/" "$conf"; fi
          else
            neu=true
            mkdir -p "$ordner"
            vorlage="$GITHUB_WORKSPACE/app/$ORDNER/linux/paket/paket.conf"
            if [ -f "$vorlage" ]; then
              sed -E \
                -e "s/^VERSION=.*/VERSION=$VER/" \
                -e "s/^SHA256_amd64=.*/SHA256_amd64=$SUMME/" \
                -e "s/^SEITE=.*/SEITE=$SEITE/" \
                -e "s/^STARTER=.*/STARTER=$STARTER/" \
                -e "s|^# Pruefsumme des .deb aus dem Release \(noch keines\)\.|# Release $TAG ($GITHUB_REPOSITORY), Pruefsumme aus SHA256SUMS ($heute).|" \
                -e '/^# VORLAGE fuer Rosenweg\/os-stationen/d' \
                -e 's/^# Aus pubspec\.yaml: .*/# Aus pubspec.yaml: x.y.z+n -> x.y.z-n./' \
                -e '/^# \(dorthin kopieren, zusammen mit hochladen\.sh/d' \
                "$vorlage" > "$conf"
            else
              cat > "$conf" <<EOF
          # shellcheck shell=bash
          # ============================================================================
          # ${TITEL:-$APP} — welches Paket, wo es liegt, woran man es erkennt
          # ============================================================================
          # Gelesen von hochladen.sh, lib/common.sh (rosenweg_paket_einspielen) und
          # roles/desktop/parts/60-programme.sh (SEITE, STARTER). Angelegt von
          # rosenweg-basis app.yml (Job stationen) nach dem Release $TAG von
          # $GITHUB_REPOSITORY; das .deb kommt aus diesem Release.
          # ============================================================================

          VERSION=$VER

          # Release $TAG, Pruefsumme aus SHA256SUMS des Releases ($heute).
          SHA256_amd64=$SUMME

          PFAD_AUF_PXE=/pxe/pakete

          # Die Web-Seite (/api/stations/<id>/apps), die die App auf der Station
          # ersetzt; sichtbar fuer dieselben Gruppen.
          SEITE=$SEITE
          STARTER=$STARTER
          EOF
            fi
            # alle App-Pakete teilen ein Skript; der Ordnername ist der Paketname
            ln -sfn ../rosenweg-vm/hochladen.sh "$ordner/hochladen.sh"
          fi
          for p in VERSION SHA256_amd64 SEITE STARTER; do
            grep -q "^$p=." "$conf" || { echo "::error::$conf ohne $p"; cat "$conf"; exit 1; }
          done
          git diff --stat; git status --short
          if git diff --quiet && [ "$neu" = false ]; then
            echo "::notice::os-stationen hat $APP $VER schon."; exit 0
          fi

          zweig="paket/$APP-$VER"
          id="$(gh api "/users/${SLUG}%5Bbot%5D" -q .id)"
          git config user.name "${SLUG}[bot]"
          git config user.email "${id}+${SLUG}[bot]@users.noreply.github.com"
          git switch -C "$zweig"
          git add "$ordner"
          if [ "$neu" = true ]; then betreff="${TITEL:-$APP} $VER neu auf den Stationen"; else betreff="${TITEL:-$APP} $VER"; fi
          git commit -q -m "$betreff" -m "Release $TAG ($rel_url), Datei $DATEI, SHA256 $SUMME. Automatisch von rosenweg-basis app.yml (Job stationen)."
          git push -f origin "$zweig"

          text="$(printf '%s\n' \
            "Automatisch nach dem Release [$TAG]($rel_url) von \`$GITHUB_REPOSITORY\`." \
            "" \
            "| | |" "|---|---|" \
            "| Paket | \`$APP\` $( [ "$neu" = true ] && echo '(neu)' ) |" \
            "| VERSION | \`$VER\` |" \
            "| Datei | \`$DATEI\` |" \
            "| SHA256_amd64 | \`$SUMME\` (gleich wie SHA256SUMS des Release) |" \
            "| SEITE | \`$(sed -n 's/^SEITE=//p' "$conf" | head -1)\` |" \
            "| STARTER | \`$STARTER\` |" \
            "" \
            "${hinweis:+**Achtung:** $hinweis}" \
            "" \
            "Mit dem Label \`paket-update\` laedt \`paket-hochladen.yml\` das .deb auf den PXE-Server (CT 135) und meldet das hier. **Erst danach mergen**, dann wie gewohnt ausrollen (erst test, dann main)." \
            "" \
            "Lauf: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")"
          nummer="$(gh pr list --repo Rosenweg/os-stationen --head "$zweig" --state open --json number -q '.[].number' | head -1)"
          if [ -n "$nummer" ]; then
            gh pr edit "$nummer" --repo Rosenweg/os-stationen --title "$betreff" --body "$text" --add-label paket-update
            echo "::notice::PR #$nummer in os-stationen aktualisiert"
          else
            gh pr create --repo Rosenweg/os-stationen --base main --head "$zweig" --title "$betreff" --body "$text" --label paket-update
          fi

  # Windows/macOS/iOS ins bestehende Release, sobald sie fertig sind - auch wenn
  # eine davon scheitert (GitHub-Runner: Minuten, Ausgabenlimit). Danach /apps.
  nachtrag:
    needs: [version, linux, android, release, windows, macos, ios]
    if: ${{ always() && needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write   # Dateien und Text des Release
      actions: write    # apps.yml fuer den Tag starten
    env:
      PHASE: nachtrag
      TAG: ${{ needs.version.outputs.tag }}
      VERSION: ${{ needs.version.outputs.version }}
      TITEL: ${{ inputs.titel }}
      PLATTFORMEN: ${{ inputs.plattformen }}
      WF: ${{ inputs.apps_workflow }}
      ST_LINUX: ${{ needs.linux.result }}
      ST_ANDROID: ${{ needs.android.result }}
      ST_WINDOWS: ${{ needs.windows.result }}
      ST_MACOS: ${{ needs.macos.result }}
      ST_IOS: ${{ needs.ios.result }}
    steps:
      # alle vorhandenen Artefakte (fuer SHA256SUMS ueber alles); fehlende
      # Plattformen haben keins
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: ${{ inputs.app }}-*
          path: ausgabe
          merge-multiple: true

      - *summen

      - *release_schritt
