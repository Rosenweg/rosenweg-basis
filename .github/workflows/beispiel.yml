# Beispiel-App (example/) auf allen fuenf Plattformen bauen. Die Bausteine
# bringen native Plugins mit (pdfrx/PDFium, mobile_scanner, file_selector,
# share_plus, desktop_drop, image_picker) – so faellt auf, wenn eines davon
# auf einer Plattform nicht mehr baut, bevor es eine App trifft.
#
# Alles auf GitHub-Runnern (oeffentliches Repo, wie pruefen.yml und app.yml):
# Linux im Container debian:13 wie die Stationen, Android auf ubuntu-latest,
# macOS/iOS und Windows bei GitHub. Keine Signatur, keine Secrets.
#
# Ausnahme Tag beispiel-v<version> (Version aus example/pubspec.yaml): nur der
# Job release - Android-APK mit dem Rosenweg-Schluessel signiert als GitHub-
# Release "Rosenweg Bausteine <version>". Fuer den Android-Dauertest (CT 149,
# Website noc/android-dauertest), NICHT fuer /apps und nicht fuer Bewohner.
# Eigenes Tag-Muster, damit die Bibliotheks-Tags v* kein Beispiel-Release
# ausloesen. Die Secrets kommen nur in diesen Job und nur bei Tag-Push - nie
# bei pull_request (Fork-PRs bekommen ohnehin keine).
name: Beispiel

on:
  push:
    branches: [main]
    tags: ['beispiel-v*']
  pull_request:
    paths:
      - 'lib/**'
      - 'android/**'
      - 'ios/**'
      - 'example/**'
      - 'pubspec.yaml'
      - '.github/workflows/beispiel.yml'
  workflow_dispatch:

concurrency:
  group: beispiel-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.5"
  FLUTTER_SHA256: 2132e990f236f8d22e7c6314b29a191a95b10d7cbcfec9b4e2e303d996652cbb

jobs:
  linux:
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    container: debian:13
    timeout-minutes: 45
    steps:
      - name: Systempakete
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            ca-certificates clang cmake ninja-build pkg-config xz-utils curl unzip git zstd \
            libgtk-3-dev liblzma-dev libstdc++-14-dev libsecret-1-dev libjsoncpp-dev >/dev/null

      - uses: actions/checkout@v4

      - name: Flutter-Cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/rosenweg-flutter-ci
          key: flutter-beispiel-linux-${{ env.FLUTTER_VERSION }}-${{ env.FLUTTER_SHA256 }}-${{ hashFiles('pubspec.yaml', 'example/pubspec.lock') }}
          restore-keys: flutter-beispiel-linux-${{ env.FLUTTER_VERSION }}-${{ env.FLUTTER_SHA256 }}-

      - name: Flutter (feste Version mit Pruefsumme)
        run: |
          set -euo pipefail
          C="$HOME/.cache/rosenweg-flutter-ci"; mkdir -p "$C"
          if [ ! -x "$C/flutter-$FLUTTER_VERSION/bin/flutter" ]; then
            curl -fsSL -o "$C/flutter.txz" "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_$FLUTTER_VERSION-stable.tar.xz"
            echo "$FLUTTER_SHA256  $C/flutter.txz" | sha256sum -c -
            mkdir -p "$C/flutter-$FLUTTER_VERSION" && tar -xJf "$C/flutter.txz" -C "$C/flutter-$FLUTTER_VERSION" --strip-components=1 && rm "$C/flutter.txz"
          fi
          git config --global --add safe.directory "$C/flutter-$FLUTTER_VERSION"
          echo "$C/flutter-$FLUTTER_VERSION/bin" >> "$GITHUB_PATH"
          echo "PUB_CACHE=$C/pub-cache" >> "$GITHUB_ENV"
          # Git-Abhaengigkeiten (rosenweg_basis) nie aus dem Cache: ein alter pub-cache/git loeste sie ohne Abhaengigkeiten auf ("Unable to satisfy pubspec.yaml using pubspec.lock", 27.11.2026)
          rm -rf "$C/pub-cache/git"

      - name: Bauen
        working-directory: example
        run: |
          flutter config --no-analytics --enable-linux-desktop >/dev/null
          flutter pub get
          flutter build linux --release

  android:
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read   # commons-rosenweg (ch.rosenweg4303:cloud, :updater) aus GitHub Packages
    env:
      JDK_VERSION: "21.0.13.1+2"
      JDK_SHA256: bb8a93f9ae6e7a693b2b721e85dbeff26ae1a77447985a8d7afcdd9c7cf6222e
      ANDROID_CMDLINE_TOOLS: "13114758"
      ANDROID_CMDLINE_TOOLS_SHA256: 7ec965280a073311c339e571cd5de778b9975026cfcbe79f2b1cdcb1e15317ee
    steps:
      - uses: actions/checkout@v4

      - &werkzeug-cache
        name: Werkzeug-Cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/rosenweg-flutter-ci
          key: android-beispiel-${{ env.FLUTTER_VERSION }}-${{ env.FLUTTER_SHA256 }}-${{ env.JDK_SHA256 }}-${{ env.ANDROID_CMDLINE_TOOLS_SHA256 }}-${{ hashFiles('example/pubspec.lock', 'android/*.kts', 'example/android/**/*.kts') }}
          restore-keys: android-beispiel-${{ env.FLUTTER_VERSION }}-${{ env.FLUTTER_SHA256 }}-${{ env.JDK_SHA256 }}-${{ env.ANDROID_CMDLINE_TOOLS_SHA256 }}-

      - &werkzeug
        name: Flutter, JDK, Android-SDK (feste Versionen mit Pruefsumme)
        run: |
          set -euo pipefail
          C="$HOME/.cache/rosenweg-flutter-ci"; mkdir -p "$C"
          if [ ! -x "$C/flutter-$FLUTTER_VERSION/bin/flutter" ]; then
            curl -fsSL -o "$C/flutter.txz" "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_$FLUTTER_VERSION-stable.tar.xz"
            echo "$FLUTTER_SHA256  $C/flutter.txz" | sha256sum -c -
            mkdir -p "$C/flutter-$FLUTTER_VERSION" && tar -xJf "$C/flutter.txz" -C "$C/flutter-$FLUTTER_VERSION" --strip-components=1 && rm "$C/flutter.txz"
          fi
          J="$C/jdk-${JDK_VERSION//+/_}"
          if [ ! -x "$J/bin/java" ]; then
            curl -fsSL -o "$C/jdk.tgz" "https://github.com/adoptium/temurin21-binaries/releases/download/jdk-${JDK_VERSION//+/%2B}/OpenJDK21U-jdk_x64_linux_hotspot_${JDK_VERSION//+/_}.tar.gz"
            echo "$JDK_SHA256  $C/jdk.tgz" | sha256sum -c -
            mkdir -p "$J" && tar -xzf "$C/jdk.tgz" -C "$J" --strip-components=1 && rm "$C/jdk.tgz"
          fi
          A="$C/android-sdk"
          if [ ! -x "$A/cmdline-tools/$ANDROID_CMDLINE_TOOLS/bin/sdkmanager" ]; then
            curl -fsSL -o "$C/ct.zip" "https://dl.google.com/android/repository/commandlinetools-linux-${ANDROID_CMDLINE_TOOLS}_latest.zip"
            echo "$ANDROID_CMDLINE_TOOLS_SHA256  $C/ct.zip" | sha256sum -c -
            rm -rf "$C/ct" && unzip -q "$C/ct.zip" -d "$C/ct" && rm "$C/ct.zip"
            mkdir -p "$A/cmdline-tools"
            rm -rf "$A/cmdline-tools/$ANDROID_CMDLINE_TOOLS" && mv "$C/ct/cmdline-tools" "$A/cmdline-tools/$ANDROID_CMDLINE_TOOLS" && rm -rf "$C/ct"
          fi
          ln -sfn "$ANDROID_CMDLINE_TOOLS" "$A/cmdline-tools/latest"
          (yes || true) | JAVA_HOME="$J" "$A/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$A" --licenses >/dev/null
          if [ ! -d "$A/platform-tools" ]; then
            JAVA_HOME="$J" "$A/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$A" "platform-tools" >/dev/null
          fi
          echo "$C/flutter-$FLUTTER_VERSION/bin" >> "$GITHUB_PATH"
          echo "$J/bin" >> "$GITHUB_PATH"
          {
            echo "JAVA_HOME=$J"
            echo "ANDROID_HOME=$A"
            echo "ANDROID_SDK_ROOT=$A"
            echo "GRADLE_USER_HOME=$C/gradle"
            echo "GRADLE_OPTS=-Dorg.gradle.daemon=false"
            echo "PUB_CACHE=$C/pub-cache"
          } >> "$GITHUB_ENV"
          # Git-Abhaengigkeiten (rosenweg_basis) nie aus dem Cache: ein alter pub-cache/git loeste sie ohne Abhaengigkeiten auf ("Unable to satisfy pubspec.yaml using pubspec.lock", 27.11.2026)
          rm -rf "$C/pub-cache/git"

      - name: Bauen
        working-directory: example
        env:
          # android/build.gradle.kts holt commons-rosenweg aus GitHub Packages
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          flutter config --no-analytics >/dev/null
          flutter pub get
          flutter build apk --debug

  macos-ios:
    if: github.ref_type != 'tag'
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: macOS bauen
        working-directory: example
        run: |
          flutter config --no-analytics >/dev/null
          flutter pub get
          flutter build macos --debug
      - name: iOS bauen (ohne Signatur)
        working-directory: example
        run: flutter build ios --debug --no-codesign

  windows:
    if: github.ref_type != 'tag'
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - name: Bauen
        working-directory: example
        run: |
          flutter config --no-analytics --enable-windows-desktop >/dev/null
          flutter pub get
          flutter build windows --release

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/beispiel-v')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write   # Release anlegen
      packages: read    # commons-rosenweg aus GitHub Packages
    env:
      JDK_VERSION: "21.0.13.1+2"
      JDK_SHA256: bb8a93f9ae6e7a693b2b721e85dbeff26ae1a77447985a8d7afcdd9c7cf6222e
      ANDROID_CMDLINE_TOOLS: "13114758"
      ANDROID_CMDLINE_TOOLS_SHA256: 7ec965280a073311c339e571cd5de778b9975026cfcbe79f2b1cdcb1e15317ee
      PAKET: ch.rosenweg4303.rosenweg_basis_beispiel
      # Rosenweg-Schluessel (wie signatur_sha256 in app.yml und /apps-Index)
      SOLL: 7b3bac26e82b6103546b96861dcf1bb89b3239424ff11fdf684975cf78c5a5ae
    steps:
      - uses: actions/checkout@v4

      - *werkzeug-cache

      - *werkzeug

      - name: Version aus Tag und pubspec
        id: v
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version:[[:space:]]*//p' example/pubspec.yaml | tr -d '[:space:]' | cut -d+ -f1)
          tag="${GITHUB_REF_NAME}"
          [ "$tag" = "beispiel-v$version" ] || { echo "::error::Tag $tag passt nicht zu example/pubspec.yaml ($version)"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Signierschluessel
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          [ -n "${ANDROID_KEYSTORE_BASE64:-}" ] || { echo "::error::Kein Rosenweg-Signierschluessel (Org-Secret ANDROID_KEYSTORE_BASE64 fuer rosenweg-basis freigeben) - kein Release."; exit 1; }
          (umask 077; printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/rosenweg.jks")
          echo "SIGNING_STORE_FILE=$RUNNER_TEMP/rosenweg.jks" >> "$GITHUB_ENV"

      - name: APK bauen und pruefen
        working-directory: example
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GITHUB_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          flutter config --no-analytics >/dev/null
          flutter pub get
          flutter build apk --release
          apk=build/app/outputs/flutter-apk/app-release.apk
          bt=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          badging=$("$bt/aapt2" dump badging "$apk" | head -n 1)
          echo "$badging"
          echo "$badging" | grep -q "name='$PAKET'" || { echo "::error::Paketname ist nicht $PAKET"; exit 1; }
          echo "$badging" | grep -q "versionName='$VERSION'" || { echo "::error::versionName passt nicht zu $VERSION"; exit 1; }
          ist=$("$bt/apksigner" verify --print-certs "$apk" | sed -n 's/.*certificate SHA-256 digest: //p' | head -n 1 | tr -d ':' | tr 'A-F' 'a-f')
          [ "$ist" = "$SOLL" ] || { echo "::error::Signatur passt nicht zum Rosenweg-Schluessel (SHA-256 $ist)"; exit 1; }
          mkdir -p "$RUNNER_TEMP/ausgabe"
          cp "$apk" "$RUNNER_TEMP/ausgabe/rosenweg-bausteine-$VERSION.apk"
          (cd "$RUNNER_TEMP/ausgabe" && sha256sum "rosenweg-bausteine-$VERSION.apk" > "rosenweg-bausteine-$VERSION.apk.sha256" && cat ./*.sha256)

      - name: Schluessel entfernen
        if: always()
        run: rm -f "$RUNNER_TEMP/rosenweg.jks"

      - name: Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          a="$RUNNER_TEMP/ausgabe/rosenweg-bausteine-$VERSION.apk"
          {
            echo "Rosenweg Bausteine $VERSION - Beispiel-App der rosenweg_basis (Vorfuehrdaten, ohne Anmeldung)."
            echo
            echo "Nur fuer den Android-Dauertest der Technik, nicht fuer Bewohner und nicht auf /apps."
            echo
            echo "- Paket: \`$PAKET\`"
            echo "- APK SHA-256: \`$(cut -c1-64 "$a.sha256")\`"
            echo "- Signaturzertifikat SHA-256 (Rosenweg-Schluessel): \`$SOLL\`"
          } > "$RUNNER_TEMP/text.md"
          gh release create "$GITHUB_REF_NAME" "$a" "$a.sha256" \
            --title "Rosenweg Bausteine $VERSION" --notes-file "$RUNNER_TEMP/text.md" --verify-tag
