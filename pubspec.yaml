name: rosenweg_basis
description: "Gemeinsame Basis der Rosenweg-Funktions-Apps: Anmeldung (Authentik rosenweg-apps), API-Client, Haus-Erkennung, Rechte, Listen, Formulare, Scanner, Dateien, PDF, Diagramme, Echtzeit (MQTT), Farben, Bausteine, Logo-Baukasten."
version: 0.8.2
publish_to: 'none'
repository: https://github.com/Rosenweg/rosenweg-basis

environment:
  sdk: ^3.13.4
  flutter: '>=3.38.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  crypto: ^3.0.8
  ffi: ^2.1.4
  flutter_secure_storage: ^11.2.0
  http: ^1.6.0
  package_info_plus: ^10.2.2
  url_launcher: ^6.3.3
  pointycastle: ^4.0.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.5.0
  file_selector: ^1.1.0
  image_picker: ^1.2.4
  share_plus: ^13.3.1
  pdfrx: ^3.0.0
  desktop_drop: ^0.8.4
  zxing2: ^0.2.4
  image: ^4.13.1
  http_parser: ^4.1.2
  path_provider: ^2.1.5
  # 23.x braucht compileSdk 37 (fehlt in der CI und bei vielen Bau-Umgebungen)
  flutter_local_notifications: ">=22.3.3 <23.0.0"
  workmanager: ^0.10.10
  timezone: ^0.11.2
  app_links: ^7.2.2
  fl_chart: ^1.3.1
  mqtt_client: ^10.14.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  # Android-Teil: Ruecksprung der Anmeldung (<applicationId>:/anmeldung),
  # DNS-Server des aktiven Netzes, Schnittstelle zu Rosenweg Geraet.
  # iOS: Karte (Core NFC), QR (VisionKit), Geraetekennung. Desktop braucht
  # keinen nativen Teil (PC/SC und Kerberos per FFI).
  plugin:
    platforms:
      android:
        package: ch.rosenweg4303.basis
        pluginClass: RosenwegBasisPlugin
      # iOS: Rosenweg-Karte per Core NFC, QR per VisionKit, Geraetekennung
      ios:
        pluginClass: RosenwegBasisPlugin
  assets:
    - assets/logo/rosenweg-512.png
    # Rosenweg-Siegel des Anmeldeschirms (wie commons-rosenweg, Modul anmeldeschirm)
    - assets/anmeldung/rosenweg-siegel.webp
