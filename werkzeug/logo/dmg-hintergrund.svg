<svg xmlns="http://www.w3.org/2000/svg" width="640" height="420" viewBox="0 0 640 420">
  <!-- Hintergrund des DMG-Fensters (640x420), erzeugt von rosenweg-basis
       werkzeug/logo/app-symbole.sh aus werkzeug/logo/dmg-hintergrund.svg (Titel und
       Logo = assets/logo/<app>-klein.svg eingesetzt). Symbole liegt Finder darueber:
       App bei (165,215), Programme bei (475,215), siehe dmg-einstellungen.py. -->
  <defs>
    <linearGradient id="grund" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F7EFEA"/>
    </linearGradient>
    <marker id="spitze" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4.2" markerHeight="4.2" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#D32F2F"/>
    </marker>
  </defs>
  <rect width="640" height="420" fill="url(#grund)"/>
  <!-- Weg als leises Band ueber den Grund, wie im Wappen -->
  <path d="M-20 360 C 140 330 260 350 360 372 C 470 396 560 380 660 352 L660 440 L-20 440 Z" fill="#D32F2F" opacity="0.07"/>
  <!-- Kopf: Wappen + Name -->
  <svg x="32" y="26" width="54" height="54" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  {{LOGO}}
  </svg>
  <text x="100" y="50" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#3E0B0B">{{TITEL}}</text>
  <text x="100" y="72" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#7A4A45">Installation für macOS</text>
  <line x1="32" y1="98" x2="608" y2="98" stroke="#D32F2F" stroke-opacity="0.25" stroke-width="1"/>
  <!-- Pfeil von der App zu Programme -->
  <path d="M250 205 C 290 170 350 170 390 205" fill="none" stroke="#D32F2F" stroke-width="5" stroke-linecap="round" marker-end="url(#spitze)"/>
  <text x="320" y="252" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#3E0B0B">In „Programme“ ziehen</text>
  <!-- Fuss -->
  <text x="320" y="398" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11.5" fill="#7A4A45">Danach im Ordner „Programme“ starten · rosenweg4303.ch</text>
</svg>
