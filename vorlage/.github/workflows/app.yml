# Bau und Release fuer alle Plattformen - die Arbeit macht der wiederverwendbare
# Workflow in rosenweg-basis (.github/workflows/app.yml, dort die Einzelheiten).
#
#   Pull Request          Linux (analyze, test, .deb) und Android (APK, Debug-
#                         Signatur); Windows dazu, wenn das Repo oeffentlich
#                         ist; macOS und iOS NICHT (nur bei Release)
#   Merge auf main        dasselbe; ist die Version in pubspec.yaml NEU (Tag
#                         vx.y.z gibt es noch nicht): GitHub-Release vx.y.z mit
#                         Linux und Android; Windows, macOS, iOS kommen dazu,
#                         sobald sie durch sind (scheitern sie, bleibt das
#                         Release, der Text nennt, was fehlt), dann /apps (apps.yml)
#   von Hand              Windows; macOS und iOS nur mit Eingabe "mac" (true),
#                         ohne Release
#
# Runner: nur von GitHub gehostete (ubuntu-latest, windows-latest,
# macos-latest), nie eigene. In einem privaten Repo kosten sie Minuten;
# Windows laeuft dort nur fuer ein Release oder von Hand. macOS und iOS
# laufen nur fuer ein Release oder von Hand mit mac: true (GitHub Free:
# nur 5 gleichzeitige macOS-Jobs je Organisation).
#
# Secrets: die Org-Secrets ANDROID_KEYSTORE_BASE64/-PASSWORD und
# ANDROID_KEY_ALIAS/-PASSWORD (fuer dieses Repo freigeben). Weitergereicht
# werden sie nur bei Push auf main, nie bei einem Pull Request. rosenweg-basis
# ist oeffentlich, pub holt sie ohne Token.
name: App

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      veroeffentlichen:
        description: Release anlegen (nur der Runner-Waechter startet so, Zweig main)
        type: boolean
        default: false
      mac:
        description: macOS und iOS auch ohne Release bauen
        type: boolean
        default: false

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  app:
    # Obergrenze fuer den wiederverwendbaren Workflow: dort hat nur der
    # Release-Teil (nach Merge mit neuer Version) Schreibrechte.
    permissions:
      contents: write   # Release (nur nach Merge mit neuer Version)
      actions: write    # apps.yml fuer den neuen Tag starten
      packages: read    # commons-rosenweg aus GitHub Packages (Android)
    uses: Rosenweg/rosenweg-basis/.github/workflows/app.yml@main
    with:
      app: rosenweg-vorlage
      paket: ch.rosenweg4303.vorlage
      titel: Rosenweg Vorlage
      veroeffentlichen: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.veroeffentlichen)) }}
      # Web-Seite, die die App auf den Stationen ersetzt (Kennung aus
      # /api/stations/<id>/apps, z. B. rosenweg-salz). Gesetzt: nach jedem
      # Release ein PR in os-stationen mit pakete/<app>/paket.conf. Leer: keiner.
      stationen_seite: ""
      mac: ${{ github.event_name == 'workflow_dispatch' && inputs.mac }}
    # nur bei Push auf main; bei pull_request leer (Debug-Signatur)
    secrets:
      ANDROID_KEYSTORE_BASE64: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.veroeffentlichen)) && secrets.ANDROID_KEYSTORE_BASE64 || '' }}
      ANDROID_KEYSTORE_PASSWORD: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.veroeffentlichen)) && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
      ANDROID_KEY_ALIAS: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.veroeffentlichen)) && secrets.ANDROID_KEY_ALIAS || '' }}
      ANDROID_KEY_PASSWORD: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.veroeffentlichen)) && secrets.ANDROID_KEY_PASSWORD || '' }}
      MACOS_ZERTIFIKAT_P12: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.veroeffentlichen)) && secrets.MACOS_ZERTIFIKAT_P12 || '' }}
      MACOS_ZERTIFIKAT_PASSWORT: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.veroeffentlichen)) && secrets.MACOS_ZERTIFIKAT_PASSWORT || '' }}
      NOTAR_KEY_P8: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.veroeffentlichen)) && secrets.NOTAR_KEY_P8 || '' }}
      NOTAR_KEY_ID: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.veroeffentlichen)) && secrets.NOTAR_KEY_ID || '' }}
      NOTAR_ISSUER: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.veroeffentlichen)) && secrets.NOTAR_ISSUER || '' }}
      WINDOWS_ZERTIFIKAT_PFX: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.veroeffentlichen)) && secrets.WINDOWS_ZERTIFIKAT_PFX || '' }}
      WINDOWS_ZERTIFIKAT_PASSWORT: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.veroeffentlichen)) && secrets.WINDOWS_ZERTIFIKAT_PASSWORT || '' }}
      # GitHub App "Rosenweg Pakete": Runner-Liste (Job wahl, immer) und os-stationen (stationen_seite)
      PAKETE_APP_ID: ${{ secrets.PAKETE_APP_ID }}
      PAKETE_APP_KEY: ${{ secrets.PAKETE_APP_KEY }}
